<!DOCTYPE html>
<html class="dark">
<head>
    <title>SLINK // DASHBOARD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        body { background: #050508; color: #0cf; font-family: 'Share Tech Mono', monospace; }
        .glass { background: rgba(10, 10, 20, 0.6); backdrop-filter: blur(8px); }
        .neon-text { text-shadow: 0 0 10px #00f2ff; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-12 border-b border-cyan-900 pb-4">
            <div class="flex items-center gap-4">
                <span class="text-4xl font-black italic tracking-tighter neon-text">SLINK_CORE</span>
                <span class="bg-cyan-900/30 text-[10px] px-2 py-1 rounded text-cyan-400">NODE_ACTIVE</span>
            </div>
            <div class="text-right text-[10px] opacity-40">
                <p>SYSTEM_UPTIME: 100%</p>
                <p>STORAGE_LOAD: OPTIMAL</p>
            </div>
        </header>

        <div class="glass border border-cyan-900/50 rounded-lg overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead class="bg-black/40 text-[11px] uppercase opacity-60">
                    <tr>
                        <th class="px-6 py-4">Token</th>
                        <th>Filename</th>
                        <th>Downloads</th>
                        <th>Expiry</th>
                        <th>Status</th>
                        <th class="text-right px-6">Management</th>
                    </tr>
                </thead>
                <tbody>
                    {% for s in shares %}
                    <tr class="border-b border-white/5 hover:bg-white/5 transition-all">
                        <td class="px-6 py-4 font-mono text-pink-500 font-bold">{{ s.token }}</td>
                        <td>{{ s.filename }}</td>
                        <td>{{ s.downloads }} / {{ s.max_downloads or '∞' }}</td>
                        <td class="opacity-60">{{ s.expires|datetime if s.expires else 'NEVER' }}</td>
                        <td><span class="status-dot {{ 'bg-green-500 shadow-[0_0_8px_#22c55e]' if s.enabled else 'bg-red-500' }}"></span></td>
                        <td class="text-right px-6">
                            <button onclick="req('toggle', '{{ s.token }}')" class="hover:text-white mr-4 text-[10px] border border-cyan-900 px-2 py-1">TOGGLE</button>
                            <button onclick="req('delete', '{{ s.token }}')" class="hover:text-red-500 text-[10px] border border-red-900 px-2 py-1">WIPE</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <script>
        async function req(type, token) {
            const secret = window.location.pathname.split('/')[2];
            await fetch(`/api/${type}/${secret}/${token}`, {method: 'POST'});
            location.reload();
        }
    </script>
</body>
</html>
